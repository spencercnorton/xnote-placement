name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse as an ES module
        run: |
          cp extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
      - name: Release invariants
        run: python3 tests/static-check.py
      - name: Shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck build-essential debhelper dpkg-dev lintian
          shellcheck scripts/build-deb.sh
      - name: Debian package
        run: |
          scripts/build-deb.sh /tmp/dist
          lintian --fail-on error,warning /tmp/dist/gnome-shell-extension-xnote-placement_*_all.deb
